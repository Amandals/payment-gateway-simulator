services:

  postgres:
    image: postgres:16
    container_name: payment-gateway-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: